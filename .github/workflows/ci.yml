name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Syntax check
        run: |
          node --check extension.js
          node --check pi-rpc.js
          node --check webview.js
      - name: Validate package.json
        run: node -e "const p=require('./package.json'); if(!p.version || !p.main) { console.error('invalid package.json'); process.exit(1); }"
